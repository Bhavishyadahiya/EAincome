######################### User Configuration #########################

# Device name (used for identification)
DEVICE_NAME='ubuntu'

# Set to true if you want to start EarnApp
# After start, copy the generated URL into your EarnApp dashboard
EARNAPP=true

# Build the EarnApp image locally instead of pulling one from a registry.
# Recommended, and the default. The image is built once, before any node starts,
# and then reused for every node UUID, so all your nodes run an identical binary
# with a TLS trust store as fresh as the day you built it.
#
# It also sets NODE_EXTRA_CA_CERTS, without which the earnapp binary ignores the
# system certificate store and registration fails with "check internet connection
# and try again" on hosts whose internet is perfectly fine.
#
# Requires the docker/ folder shipped with this script. Rebuild at any time with
#   sudo bash EAincome.sh --build
BUILD_EARNAPP_IMAGE=true

# Tag given to the locally built image.
EARNAPP_LOCAL_TAG='eaincome/earnapp:local'

# Prebuilt EarnApp image, used only when BUILD_EARNAPP_IMAGE=false.
# madereddy/earnapp supports both amd64 and arm64.
# Upstream InternetIncome uses fazalfarhan01/earnapp:lite if you prefer that.
# Note that no public image sets NODE_EXTRA_CA_CERTS, so when this path is taken
# the script bind-mounts the host's certificate bundle into the container to
# compensate. The host therefore needs the ca-certificates package installed.
EARNAPP_IMAGE='madereddy/earnapp:latest'

######################### Network Configuration #########################

# Enable proxies (requires proxies.txt)
# Add one proxy per line in the format protocol://user:pass@ip:port
# Supported protocols: http, https, socks4, socks5
# socks5h:// and socks4a:// are accepted and normalised automatically.
USE_PROXIES=false

# Proxy container image. All proxies are routed through tun2proxy.
TUN2PROXY_IMAGE='ghcr.io/tun2proxy/tun2proxy:v0.8.3'

# How tun2proxy resolves DNS. Leave blank to derive it from USE_DNS_OVER_HTTPS.
#   virtual  - answers lookups locally with synthetic IPs and sends the hostname
#              to the proxy, so names resolve at the exit node. No DNS traffic
#              ever leaves the container. This is the default when left blank.
#   over-tcp - DNS queries are sent as TCP through the proxy. Slightly slower per
#              lookup but returns real addresses.
#   direct   - DNS is passed through as UDP. Requires a proxy that supports UDP.
# Setting this explicitly overrides USE_DNS_OVER_HTTPS below.
TUN2PROXY_DNS_MODE=

# Set to true if you would like to use DNS over HTTPS or TCP.
# Kept for backwards compatibility: when TUN2PROXY_DNS_MODE is blank, setting
# this to true selects 'over-tcp'.
USE_DNS_OVER_HTTPS=false

# DEPRECATED. This previously selected the hev-socks5-tunnel container.
# All proxies now run through tun2proxy. Use TUN2PROXY_DNS_MODE='direct' to
# resolve DNS at the proxy over UDP instead.
USE_SOCKS5_DNS=false

######################### Performance Configuration #########################

# Enable logs only for debugging (reduces performance)
ENABLE_LOGS=false
