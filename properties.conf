######################### User Configuration #########################

# Device name (used for identification)
DEVICE_NAME='ubuntu'

# Set to true if you want to start EarnApp
# After start, copy the generated URL into your EarnApp dashboard
EARNAPP=true

# Build the EarnApp image locally instead of pulling one from a registry.
# Recommended, and the default. The image is built once, before any node starts,
# and then reused for every node UUID, so all your nodes run an identical binary
# with a TLS trust store as fresh as the day you built it.
#
# It also sets NODE_EXTRA_CA_CERTS, without which the earnapp binary ignores the
# system certificate store and registration fails with "check internet connection
# and try again" on hosts whose internet is perfectly fine.
#
# Requires the docker/ folder shipped with this script. Rebuild at any time with
#   sudo bash EAincome.sh --build
BUILD_EARNAPP_IMAGE=true

# Tag given to the locally built image.
EARNAPP_LOCAL_TAG='eaincome/earnapp:local'

# Prebuilt EarnApp image, used only when BUILD_EARNAPP_IMAGE=false.
# madereddy/earnapp supports both amd64 and arm64.
# Upstream InternetIncome uses fazalfarhan01/earnapp:lite if you prefer that.
# Note that no public image sets NODE_EXTRA_CA_CERTS, so when this path is taken
# the script bind-mounts the host's certificate bundle into the container to
# compensate. The host therefore needs the ca-certificates package installed.
EARNAPP_IMAGE='madereddy/earnapp:latest'

######################### Network Configuration #########################

# Enable proxies (requires proxies.txt)
# Add one proxy per line in the format protocol://user:pass@ip:port
# Supported protocols: http, https, socks4, socks5
# socks5h:// and socks4a:// are accepted and normalised automatically.
USE_PROXIES=true

# Proxy container image. All proxies are routed through tun2proxy.
TUN2PROXY_IMAGE='ghcr.io/tun2proxy/tun2proxy:v0.8.5'

# Maximum bandwidth per node/tunnel, in Mbps.
# 0 = unlimited.
MAX_BANDWIDTH_MBPS=100

# Apply the bandwidth limit to upload, download, or both.
# Valid values: upload, download, both.
BANDWIDTH_LIMIT_DIRECTION=both

# How tun2proxy resolves DNS. Leave blank to derive it from USE_DNS_OVER_HTTPS.
#   virtual  - answers lookups locally with synthetic IPs and sends the hostname
#              to the proxy, so names resolve at the exit node. No DNS traffic
#              ever leaves the container. This is the default when left blank.
#   over-tcp - DNS queries are sent as TCP through the proxy. Slightly slower per
#              lookup but returns real addresses.
#   direct   - DNS is passed through as UDP. Requires a proxy that supports UDP.
# Setting this explicitly overrides USE_DNS_OVER_HTTPS below.
TUN2PROXY_DNS_MODE=over-tcp

# Set to true if you would like to use DNS over HTTPS or TCP.
# Kept for backwards compatibility: when TUN2PROXY_DNS_MODE is blank, setting
# this to true selects 'over-tcp'.
USE_DNS_OVER_HTTPS=false

# DEPRECATED. This previously selected the hev-socks5-tunnel container.
# All proxies now run through tun2proxy. Use TUN2PROXY_DNS_MODE='direct' to
# resolve DNS at the proxy over UDP instead.
USE_SOCKS5_DNS=false

######################### Performance Configuration #########################

# Enable logs only for debugging (reduces performance)
ENABLE_LOGS=false

# Log retention per container, used only when ENABLE_LOGS=true.
# Docker's json-file driver rotates at LOG_MAX_SIZE and keeps LOG_MAX_FILES of
# them, so the worst case on disk is size x files x containers. The defaults hold
# roughly a day of a busy node's output; upstream's 100k with one file holds only
# a couple of minutes, which is not enough to diagnose anything after the fact.
LOG_MAX_SIZE='10m'
LOG_MAX_FILES=3

# tun2proxy verbosity when ENABLE_LOGS=true: off, error, warn, info, debug, trace.
# trace logs every relayed connection on every node. Use it only when the proxy
# itself is what you are debugging.
TUN2PROXY_LOG_LEVEL='info'

######################### Node Watcher Configuration #########################

# nodeWatcher.sh reads the same feed of banned and offline node ids that your
# dashboard publishes, and restarts only the nodes this folder started. It needs
# no cookies and asks nothing interactively: the verdict comes from the feed and
# the bearer token is read from a file. The keys below are read by the watcher
# itself; an explicit VAR=... in front of the command still overrides any of them.
#
# Two ways to run it. By hand, one pass or looping, from this folder:
#   bash nodeWatcher.sh --report     one pass, print the verdict, change nothing
#   bash nodeWatcher.sh --once        one pass, act on it
#   bash nodeWatcher.sh --watch       loop every INTERVAL, acting each pass
#   bash nodeWatcher.sh --watch -n    loop but only log what it would restart
#
# Or as a container that --start launches and keeps alive (--restart=always), so
# it survives reboots and outlives your shell. Set NODE_WATCHER=true below and it
# comes up with every --start; --delete stops it before touching any node. You can
# also (re)launch just the watcher without touching nodes: bash EAincome.sh --watcher
#
# The container needs two things or --start quietly skips it: WATCH_URL set below,
# and the bearer token present in TOKEN_FILE. It is built locally from
# docker/watcher.Dockerfile (never pulled) and handed the host docker socket so it
# can restart sibling containers. A mounted docker socket is root-equivalent on the
# host: only the node ids this folder mapped are ever acted on, but be aware of it.
#
# Opt in to the --start-managed container. Default false: --start leaves the
# watcher alone unless you set this true. Manual runs above ignore this gate.
#NODE_WATCHER=false

# The locally-built image tag and the arguments passed to it. --watch loops every
# INTERVAL; append --dry-run (NODE_WATCHER_ARGS='--watch --dry-run') to have the
# container only log what it would restart without acting.
#NODE_WATCHER_LOCAL_TAG=eaincome/nodewatcher:local
#NODE_WATCHER_ARGS=--watch
#
# Why it restarts what it does: a ban is a judgement on the exit address, so the
# only fix is to restart the tun2proxy parent and get a new one; restarting the
# node changes nothing. Offline is about the node, so the node is restarted. A
# node in both lists is treated as banned.

# The feed. Required; there is no default, because a wrong guess would silently do
# nothing. Point it at your dashboard's read-only endpoint.
#WATCH_URL=http://127.0.0.1:4000/api/watch/nodes

# File holding the bearer token for that endpoint. Kept in a file, never on the
# command line, so it cannot show up in ps output. Treat it like earnapp.txt: it
# is gitignored, and it should stay that way.
#TOKEN_FILE=.watch_token

# How often --watch polls, in seconds. The dashboard refreshes every five minutes,
# so polling faster than ~300 only spends requests without learning anything newer.
# Set here to 3600 so the --start-managed container checks the fleet once an hour.
INTERVAL=3600

# Seconds to wait for the feed before giving up on a pass.
#CURL_TIMEOUT=20

# Refuse to act on a feed older than this many seconds. A large age means the
# dashboard has stopped updating, and acting on a stale list restarts blindly.
#MAX_AGE=900

# Restraint, all in seconds unless noted. Leave commented to use the defaults shown.
#   GRACE         ignore a container for this long after it starts
#   COOLDOWN      minimum gap between two restarts of the same container
#   CAP           most restarts of one container per CAP_WINDOW
#   CAP_WINDOW    the window the cap applies over
#GRACE=900
#COOLDOWN=1800
#CAP=3
#CAP_WINDOW=21600

# If more than this percentage of the nodes this folder mapped are flagged in one
# pass, the watcher does nothing: that shape is one upstream event, not many broken
# nodes, and no restart fixes it. 100 disables the guard.
#FLEET_MAX_BAD=50

# What to restart for each verdict: tunnel = the tun2proxy parent (this is how the
# exit address changes), node = the earnapp container, none = report only.
#BANNED_ACTION=tunnel
#OFFLINE_ACTION=node
