######################### User Configuration #########################

# Device name (used for identification)
DEVICE_NAME='ubuntu'

# Set to true if you want to start EarnApp
# After start, copy the generated URL into your EarnApp dashboard
EARNAPP=true

# Build the EarnApp image locally instead of pulling one from a registry.
# Recommended, and the default. The image is built once, before any node starts,
# and then reused for every node UUID, so all your nodes run an identical binary
# with a TLS trust store as fresh as the day you built it.
#
# It also sets NODE_EXTRA_CA_CERTS, without which the earnapp binary ignores the
# system certificate store and registration fails with "check internet connection
# and try again" on hosts whose internet is perfectly fine.
#
# Requires the docker/ folder shipped with this script. Rebuild at any time with
#   sudo bash EAincome.sh --build
BUILD_EARNAPP_IMAGE=true

# Tag given to the locally built image.
EARNAPP_LOCAL_TAG='eaincome/earnapp:local'

# Prebuilt EarnApp image, used only when BUILD_EARNAPP_IMAGE=false.
# madereddy/earnapp supports both amd64 and arm64.
# Upstream InternetIncome uses fazalfarhan01/earnapp:lite if you prefer that.
# Note that no public image sets NODE_EXTRA_CA_CERTS, so when this path is taken
# the script bind-mounts the host's certificate bundle into the container to
# compensate. The host therefore needs the ca-certificates package installed.
EARNAPP_IMAGE='madereddy/earnapp:latest'

######################### Network Configuration #########################

# Enable proxies (requires proxies.txt)
# Add one proxy per line in the format protocol://user:pass@ip:port
# Supported protocols: http, https, socks4, socks5
# socks5h:// and socks4a:// are accepted and normalised automatically.
USE_PROXIES=false

# Proxy container image. All proxies are routed through tun2proxy.
TUN2PROXY_IMAGE='ghcr.io/tun2proxy/tun2proxy:v0.8.3'

# How tun2proxy resolves DNS. Leave blank to derive it from USE_DNS_OVER_HTTPS.
#   virtual  - answers lookups locally with synthetic IPs and sends the hostname
#              to the proxy, so names resolve at the exit node. No DNS traffic
#              ever leaves the container. This is the default when left blank.
#   over-tcp - DNS queries are sent as TCP through the proxy. Slightly slower per
#              lookup but returns real addresses.
#   direct   - DNS is passed through as UDP. Requires a proxy that supports UDP.
# Setting this explicitly overrides USE_DNS_OVER_HTTPS below.
TUN2PROXY_DNS_MODE=

# Set to true if you would like to use DNS over HTTPS or TCP.
# Kept for backwards compatibility: when TUN2PROXY_DNS_MODE is blank, setting
# this to true selects 'over-tcp'.
USE_DNS_OVER_HTTPS=false

# DEPRECATED. This previously selected the hev-socks5-tunnel container.
# All proxies now run through tun2proxy. Use TUN2PROXY_DNS_MODE='direct' to
# resolve DNS at the proxy over UDP instead.
USE_SOCKS5_DNS=false

######################### Performance Configuration #########################

# Enable logs only for debugging (reduces performance)
ENABLE_LOGS=false

# Log retention per container, used only when ENABLE_LOGS=true.
# Docker's json-file driver rotates at LOG_MAX_SIZE and keeps LOG_MAX_FILES of
# them, so the worst case on disk is size x files x containers. The defaults hold
# roughly a day of a busy node's output; upstream's 100k with one file holds only
# a couple of minutes, which is not enough to diagnose anything after the fact.
LOG_MAX_SIZE='10m'
LOG_MAX_FILES=3

# tun2proxy verbosity when ENABLE_LOGS=true: off, error, warn, info, debug, trace.
# trace logs every relayed connection on every node. Use it only when the proxy
# itself is what you are debugging.
TUN2PROXY_LOG_LEVEL='info'

# Turn on Node's own debug channels inside the earnapp container (NODE_DEBUG and
# DEBUG). Needs ENABLE_LOGS=true to be of any use.
#
# Read this before enabling it. 'earnapp run' prints nothing at all -- not with
# --verbose, not with these variables set -- so this only makes the *registration*
# phase talk, and when it does it dumps TLS handshakes and every HTTP request the
# binary makes, including request headers and your node UUID. That makes the log
# account-identifying, so do not paste it anywhere public. It is a tool for
# diagnosing a node that will not link, not something to leave on.
EARNAPP_DEBUG=false

######################### Watchdog Configuration #########################

# Restart nodes that have stopped earning, by watching what they actually do on
# the network rather than asking the binary (which never answers) or the dashboard
# (which needs your cookies).
#
# true starts a small container at the end of --start, supervised by Docker, so
# there is no service to install and it comes back after a reboot. You can also
# start it at any time on its own:
#
#   sudo bash EAincome.sh --watchdog
#
# Each folder gets its own watcher, named after the folder, and it only ever
# touches nodes named in that folder's containernames.txt. So several copies of
# this script on one host each look after their own nodes and nothing else. Within
# that file it considers only names beginning with 'earnapp', which is what keeps
# it off the tun2proxy containers listed there beside them, and off its own
# container: the watcher's name is written into containernames.txt too, so that
# --delete removes it along with everything else the folder created.
#
# Read this before enabling it. The watchdog is given this host's Docker socket,
# because restarting a container is the entire point of it. Anything with that
# socket can do anything Docker can, which is effectively root on the host. That
# is why the image is built locally from a pinned base rather than pulled.
WATCHDOG=false

# Tag given to the locally built watchdog image. Built from docker/watchdog.Dockerfile
# on first use and reused after that; delete the image to force a rebuild.
WATCHDOG_LOCAL_TAG='eaincome/watchdog:local'

# How the watchdog runs.
#   --watch --dry-run  sample every INTERVAL and log what it *would* restart
#   --watch            sample every INTERVAL and actually restart stalled nodes
#
# The default is the harmless one on purpose. The stall thresholds below are
# inferred from healthy nodes, not from a node caught red in the dashboard, so
# leave it in dry-run for a day, look at watchdog.log, and switch it to plain
# --watch once the numbers it reports match what you believe about your nodes.
WATCHDOG_ARGS='--watch --dry-run'

# What counts as stalled, and how cautious the watchdog is about acting. Leave
# these commented out to use the script's own defaults, which are the values shown.
# All times are in seconds.
#
#   GRACE         ignore a node for this long after it starts
#   STALL_WINDOW  look back this far when measuring traffic
#   STALL_BYTES   less traffic than this over the window is a stall
#   MIN_SOCKETS   fewer established connections to :443 than this is a stall
#   COOLDOWN      minimum gap between two restarts of the same node
#   CAP           most restarts of one node per CAP_WINDOW
#   CAP_WINDOW    the window the cap applies over
#   INTERVAL      how often to sample
#
# Uncomment a whole line to change one. Nothing but the number may follow the '=',
# because everything after it is taken as the value.
#
#GRACE=900
#STALL_WINDOW=1800
#STALL_BYTES=1048576
#MIN_SOCKETS=2
#COOLDOWN=1800
#CAP=3
#CAP_WINDOW=21600
#INTERVAL=60
#
# A node has to fail *both* the traffic and the socket test to be called stalled,
# because either alone has an innocent explanation: a quiet period, or a momentary
# reconnect. The cap exists so that a node a restart cannot fix is left alone
# instead of being restarted forever.
